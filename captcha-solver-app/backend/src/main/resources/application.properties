# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:captchadbs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # Automatically update schema (create-drop for testing, update/validate for dev/prod)
spring.jpa.show-sql=true # Show SQL queries in logs, useful for debugging
spring.jpa.defer-datasource-initialization=true # For schema.sql and data.sql initialization

# Spring Security
# Allow loading of H2 console in a frame
spring.security.web.ignoring=/h2-console/**
# Note: SecurityConfig already handles frameOptions for H2 console.
# This property might be an alternative or supplemental depending on Spring Boot version nuances.
# Keeping SecurityConfig's http.headers().frameOptions().disable() is generally more robust.

# For Spring Boot 2.7.x, WebSecurityConfigurerAdapter is still available.
# If upgrading to Spring Boot 3.x, SecurityConfig needs refactoring.

# JWT Configuration
# IMPORTANT: Replace with a strong, randomly generated secret in a real application!
app.jwtSecret=RandomSecretKeyForJWTCaptchaSolverApplication1234567890!@#$%^&*()_+-=[]{}|;':,./<>?
app.jwtExpirationMs=86400000 # 24 hours
# For refresh tokens, you'd add another expiration: app.jwtRefreshExpirationMs=...
