# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/captcha_solver_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=captchasolver_user # Replace with your MySQL username
spring.datasource.password=captchasolver_password # Replace with your MySQL password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update # create, create-drop, validate, none. 'update' is fine for dev.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect # Or MySQL5InnoDBDialect for older MySQL versions

# H2 Console (still enabled for test profile, but not active with MySQL config)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Defer datasource initialization (can be useful, but review if issues arise)
# spring.jpa.defer-datasource-initialization=true

# Spring Security
# Allow loading of H2 console in a frame
spring.security.web.ignoring=/h2-console/**
# Note: SecurityConfig already handles frameOptions for H2 console.
# This property might be an alternative or supplemental depending on Spring Boot version nuances.
# Keeping SecurityConfig's http.headers().frameOptions().disable() is generally more robust.

# For Spring Boot 2.7.x, WebSecurityConfigurerAdapter is still available.
# If upgrading to Spring Boot 3.x, SecurityConfig needs refactoring.

# JWT Configuration
# IMPORTANT: Replace with a strong, randomly generated secret in a real application!
app.jwtSecret=RandomSecretKeyForJWTCaptchaSolverApplication1234567890!@#$%^&*()_+-=[]{}|;':,./<>?
app.jwtExpirationMs=86400000 # 24 hours
# For refresh tokens, you'd add another expiration: app.jwtRefreshExpirationMs=...
