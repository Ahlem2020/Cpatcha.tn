<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Subscription Plans</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div *ngFor="let plan of subscriptionPlans" class="bg-white p-4 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-2">{{ plan.name }}</h2>
      <p class="text-gray-700 mb-4">{{ plan.description }}</p>
      <p class="text-2xl font-bold mb-4">${{ plan.price }}</p>
      <p class="text-gray-700 mb-4">{{ plan.captchaPerMonth }} captcha per month</p>
      <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Subscribe
      </button>
    </div>
  </div>
</div>
