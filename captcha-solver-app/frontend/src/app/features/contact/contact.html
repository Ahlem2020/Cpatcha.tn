<div class="container mx-auto p-4">
  <div class="text-center">
    <h1 class="text-4xl font-bold mb-4">Contact Us</h1>
    <p class="text-xl text-gray-700 mb-8">We'd love to hear from you. Please fill out the form below and we'll get back to you as soon as possible.</p>
  </div>

  <form class="max-w-md mx-auto">
    <div class="mb-4">
      <label for="name" class="block text-gray-700 font-bold mb-2">Name</label>
      <input type="text" id="name" name="name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>
    <div class="mb-4">
      <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
      <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>
    <div class="mb-4">
      <label for="message" class="block text-gray-700 font-bold mb-2">Message</label>
      <textarea id="message" name="message" rows="5" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500"></textarea>
    </div>
    <div class="text-center">
      <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Submit
      </button>
    </div>
  </form>
</div>
