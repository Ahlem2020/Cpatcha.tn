<div>
  <nav class="bg-gray-800 text-white p-4 shadow-md">
    <div class="container mx-auto flex items-center justify-between">
      <a routerLink="/" class="text-xl font-bold hover:text-gray-300">{{ title() }}</a>

      <ul class="flex space-x-4">
        <li>
          <a routerLink="/home" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Home</a>
        </li>
        <li>
          <a routerLink="/product" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Our Product</a>
        </li>
        <li>
          <a routerLink="/subscription" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Subscription</a>
        </li>
        <li>
          <a routerLink="/documentation" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Documentation</a>
        </li>
        <li>
          <a routerLink="/contact" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Contact</a>
        </li>
        <li *ngIf="isLoggedIn">
          <a routerLink="/dashboard" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
        </li>
        <li *ngIf="isAdmin">
          <a routerLink="/admin" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Admin</a>
        </li>
      </ul>

      <ul class="flex space-x-4 items-center">
        <ng-container *ngIf="!isLoggedIn">
          <li>
            <a routerLink="/register" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">Sign Up</a>
          </li>
          <li>
            <a routerLink="/login" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm">Login</a>
          </li>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <li>
            <a routerLink="/profile" class="hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">{{ username }}</a>
          </li>
          <li>
            <a href="#" (click)="logout()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-sm">LogOut</a>
          </li>
        </ng-container>
      </ul>
    </div>
  </nav>

  <div class="container mx-auto mt-6 p-4">
    <router-outlet></router-outlet>
  </div>
</div>
